# ═══════════════════════════════════════════════════════════════════════════
# .github/workflows/sonarcloud.yml
# GitHub Actions — Analyse SonarCloud complète (Backend Java + Frontend React)
# ═══════════════════════════════════════════════════════════════════════════

name: 🔍 SonarCloud Analysis

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: 🚀 Build, Test & SonarCloud Analysis
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Configurer Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: 🟢 Configurer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Installer et vérifier Frontend (Lint)
        run: |
          cd frontend
          npm ci
          npm run lint || true

      - name: 🔑 Rendre mvnw exécutable
        run: chmod +x backend/mvnw

      - name: 🧪 Tests Backend + JaCoCo + Analyse SonarCloud Unifiée
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          LLM_MOCK: "true"
        run: |
          cd backend
          ./mvnw -B verify sonar:sonar \
            -Dsonar.projectKey=khmaichabdellah-minidesk \
            -Dsonar.organization=khmaichabdellah-minidesk \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=$SONAR_TOKEN \
            -Dsonar.sources=src/main/java,../frontend/src \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            -Dsonar.exclusions="**/node_modules/**,**/dist/**,**/config/**,**/entity/**,**/dto/**,**/exception/**"
