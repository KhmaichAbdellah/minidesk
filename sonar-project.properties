# ═══════════════════════════════════════════════════════════════════════════
# sonar-project.properties — Configuration SonarQube / SonarCloud
# MiniDesk — IT Helpdesk Platform
# ═══════════════════════════════════════════════════════════════════════════

# ── Identification du projet ────────────────────────────────────────────────
sonar.projectKey=khmaichabdellah-minidesk
sonar.organization=khmaichabdellah-minidesk
sonar.projectName=MiniDesk
sonar.projectVersion=1.0

# ── Serveur SonarCloud ──────────────────────────────────────────────────────
sonar.host.url=https://sonarcloud.io

# ── Sources du projet ───────────────────────────────────────────────────────
# Backend Java (Spring Boot)
sonar.sources=backend/src/main/java
sonar.tests=backend/src/test/java
sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# Frontend JavaScript / React
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# ── Couverture JaCoCo (backend) ─────────────────────────────────────────────
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

# ── Exclusions (entités, config, DTOs) ──────────────────────────────────────
sonar.exclusions=\
  **/config/**,\
  **/entity/**,\
  **/dto/**,\
  **/exception/**,\
  **/*Application.java,\
  **/DataInitializer.java,\
  frontend/node_modules/**,\
  frontend/dist/**

sonar.coverage.exclusions=\
  **/config/**,\
  **/entity/**,\
  **/dto/**,\
  **/exception/**,\
  **/*Application.java,\
  **/DataInitializer.java

# ── Encodage ────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

