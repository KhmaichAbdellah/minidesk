# ═══════════════════════════════════════════════════════════════════════════════
# k8s/prod/secrets.yaml — Secrets Kubernetes (NE PAS commiter avec de vraies valeurs)
# ═══════════════════════════════════════════════════════════════════════════════
# IMPORTANT : En production, utiliser GitLab CI/CD variables ou HashiCorp Vault
# pour injecter ces secrets. Ce fichier est un template avec des placeholders.
#
# Commande pour créer le secret manuellement :
#   kubectl create secret generic minidesk-secrets \
#     --from-literal=db-password='YOUR_DB_PASSWORD' \
#     --from-literal=jwt-secret='YOUR_JWT_SECRET' \
#     --from-literal=mail-username='YOUR_EMAIL' \
#     --from-literal=mail-password='YOUR_APP_PASSWORD' \
#     --from-literal=admin-password='YOUR_ADMIN_PASSWORD' \
#     --from-literal=openai-api-key='sk-proj-YOUR_OPENAI_KEY' \
#     --namespace=minidesk-prod
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: minidesk-secrets
  namespace: minidesk-prod
  labels:
    app: minidesk
    env: production
type: Opaque
stringData:
  # ⚠️  Remplacer ces valeurs par les vraies via kubectl ou Vault
  db-password: "REPLACE_IN_CI_OR_VAULT"
  jwt-secret: "REPLACE_IN_CI_OR_VAULT"
  mail-username: "REPLACE_IN_CI_OR_VAULT"
  mail-password: "REPLACE_IN_CI_OR_VAULT"
  admin-password: "REPLACE_IN_CI_OR_VAULT"
  openai-api-key: "REPLACE_IN_CI_OR_VAULT"
