# ═══════════════════════════════════════════════════════════════════════════════
# k8s/optional/ollama.yaml — Déploiement Ollama LLM Kubernetes (Optionnel)
# ═══════════════════════════════════════════════════════════════════════════════
# À utiliser UNIQUEMENT si vous choisissez d'héberger le modèle en local sur K8s
# plutôt que d'utiliser une API Cloud (OpenAI / Mistral).
#
# Déploiement manuel :
#   kubectl apply -f k8s/optional/ollama.yaml -n minidesk-prod
# ═══════════════════════════════════════════════════════════════════════════════
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: minidesk-prod
  labels:
    app: minidesk
    component: ollama
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi  # phi3:mini fait environ 2.3 GB

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minidesk-ollama
  namespace: minidesk-prod
  labels:
    app: minidesk
    component: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minidesk
      component: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: minidesk
        component: ollama
    spec:
      initContainers:
        - name: pull-model
          image: ollama/ollama:latest
          command:
            - sh
            - -c
            - |
              ollama serve &
              sleep 5
              ollama pull phi3:mini
              kill %1
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"

      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
              name: api
          volumeMounts:
            - name: ollama-storage
              mountPath: /root/.ollama
          resources:
            requests:
              memory: "3Gi"
              cpu: "1000m"
            limits:
              memory: "6Gi"
              cpu: "4000m"
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 20
            periodSeconds: 10

      volumes:
        - name: ollama-storage
          persistentVolumeClaim:
            claimName: ollama-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: minidesk-ollama
  namespace: minidesk-prod
  labels:
    app: minidesk
    component: ollama
spec:
  selector:
    app: minidesk
    component: ollama
  ports:
    - name: api
      port: 11434
      targetPort: 11434
  type: ClusterIP
