# ═══════════════════════════════════════════════════════════════════════════════
# k8s/staging/backend.yaml — Backend deployment pour Staging (1 réplique)
# ═══════════════════════════════════════════════════════════════════════════════
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minidesk-backend
  namespace: minidesk-staging
  labels:
    app: minidesk
    component: backend
    env: staging
spec:
  replicas: 1  # Staging : 1 réplique suffit
  selector:
    matchLabels:
      app: minidesk
      component: backend
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: minidesk
        component: backend
        env: staging
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: backend
          image: registry.gitlab.com/KhmaichAbdellah/minidesk/backend:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: minidesk-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minidesk-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: minidesk-secrets
                  key: jwt-secret
            - name: SPRING_MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: minidesk-secrets
                  key: mail-username
            - name: SPRING_MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minidesk-secrets
                  key: mail-password
            - name: APP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minidesk-secrets
                  key: admin-password
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: minidesk-secrets
                  key: openai-api-key
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: minidesk-backend
  namespace: minidesk-staging
spec:
  selector:
    app: minidesk
    component: backend
  ports:
    - port: 8081
      targetPort: 8081
  type: ClusterIP

---
# ConfigMap staging (peut différer de la prod)
apiVersion: v1
kind: ConfigMap
metadata:
  name: minidesk-config
  namespace: minidesk-staging
data:
  SPRING_PROFILES_ACTIVE: "staging"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://minidesk-postgres:5432/minideskdb"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_JPA_SHOW_SQL: "true"
  SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
  SERVER_PORT: "8081"
  SPRING_MAIL_HOST: "smtp.gmail.com"
  SPRING_MAIL_PORT: "587"
  JWT_EXPIRATION: "86400000"
  APP_ADMIN_CREATE: "true"
  APP_ADMIN_NAME: "Admin Staging"
  APP_ADMIN_EMAIL: "admin@minidesk.com"
  OLLAMA_ENDPOINT: "http://minidesk-ollama:11434/api/chat"
  OLLAMA_MODEL: "phi3:mini"
  LLM_PROVIDER: "ollama"
  LLM_MOCK: "true"  # Staging utilise le mock LLM pour économiser les ressources
  VITE_API_URL: "http://minidesk-backend:8081"

---
# Secret staging (placeholder)
apiVersion: v1
kind: Secret
metadata:
  name: minidesk-secrets
  namespace: minidesk-staging
type: Opaque
stringData:
  db-password: "REPLACE_IN_CI"
  jwt-secret: "REPLACE_IN_CI"
  mail-username: "REPLACE_IN_CI"
  mail-password: "REPLACE_IN_CI"
  admin-password: "REPLACE_IN_CI"
  openai-api-key: "REPLACE_IN_CI"

---
# PostgreSQL Staging
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minidesk-postgres
  namespace: minidesk-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minidesk
      component: postgres
  template:
    metadata:
      labels:
        app: minidesk
        component: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: minideskdb
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minidesk-secrets
                  key: db-password
          resources:
            limits:
              memory: "256Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: minidesk-postgres
  namespace: minidesk-staging
spec:
  selector:
    app: minidesk
    component: postgres
  ports:
    - port: 5432
      targetPort: 5432

---
# Frontend Staging
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minidesk-frontend
  namespace: minidesk-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minidesk
      component: frontend
  template:
    metadata:
      labels:
        app: minidesk
        component: frontend
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: frontend
          image: registry.gitlab.com/KhmaichAbdellah/minidesk/frontend:IMAGE_TAG
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          env:
            - name: VITE_API_URL
              value: "http://minidesk-backend:8081"
          resources:
            limits:
              memory: "64Mi"
              cpu: "100m"

---
apiVersion: v1
kind: Service
metadata:
  name: minidesk-frontend
  namespace: minidesk-staging
spec:
  selector:
    app: minidesk
    component: frontend
  ports:
    - port: 80
      targetPort: 80
  type: NodePort  # Accessible depuis l'extérieur pour les tests
