# ═══════════════════════════════════════════════════════════════════════════════
# .gitlab-ci.yml — Pipeline CI/CD GitLab pour MiniDesk
# ═══════════════════════════════════════════════════════════════════════════════

image: docker:27

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: "/certs"
  REGISTRY: $CI_REGISTRY
  IMAGE_BACKEND: $CI_REGISTRY_IMAGE/backend
  IMAGE_FRONTEND: $CI_REGISTRY_IMAGE/frontend
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA

services:
  - docker:27-dind

stages:
  - test
  - sonar
  - build
  - push
  - deploy-staging
  - deploy-prod

# ── Cache global ──────────────────────────────────────────────────────────────
cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - backend/.m2/
    - frontend/node_modules/

# ══════════════════════════════════════════════════════════════════════════════
# STAGE : test
# ══════════════════════════════════════════════════════════════════════════════

test:backend:
  stage: test
  image: maven:3.9.9-eclipse-temurin-21
  variables:
    SPRING_DATASOURCE_URL: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
    SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.h2.Driver"
    SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.H2Dialect"
    JWT_SECRET: "ci-only-secret-not-used-in-prod"
    MAIL_USERNAME: "test@example.com"
    MAIL_PASSWORD: "test-password"
    LLM_MOCK: "true"
  script:
    - cd backend
    - mvn test -B -Dmaven.repo.local=.m2/repository
  artifacts:
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml
    expire_in: 7 days

test:frontend:lint:
  stage: test
  image: node:22-alpine
  script:
    - cd frontend
    - npm ci || npm install
    - npm run lint || true

# ══════════════════════════════════════════════════════════════════════════════
# STAGE : sonar — Analyse qualité du code unifiée (SonarCloud)
# ══════════════════════════════════════════════════════════════════════════════
sonarcloud:
  stage: sonar
  image: maven:3.9.9-eclipse-temurin-21
  needs: [test:backend, test:frontend:lint]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
    SPRING_DATASOURCE_URL: "jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
    SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.h2.Driver"
    SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.H2Dialect"
    JWT_SECRET: "ci-only-secret-not-used-in-prod"
    MAIL_USERNAME: "test@example.com"
    MAIL_PASSWORD: "test-password"
    LLM_MOCK: "true"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
      - backend/.m2/
  script:
    - cd backend
    - >
      mvn -B verify sonar:sonar
      -Dmaven.repo.local=.m2/repository
      -Dsonar.projectKey=khmaichabdellah-minidesk
      -Dsonar.organization=khmaichabdellah-minidesk
      -Dsonar.host.url=https://sonarcloud.io
      -Dsonar.token=$SONAR_TOKEN
      -Dsonar.sources=src/main/java,../frontend/src
      -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
      -Dsonar.exclusions="**/node_modules/**,**/dist/**,**/config/**,**/entity/**,**/dto/**,**/exception/**"
  artifacts:
    reports:
      junit: backend/target/surefire-reports/TEST-*.xml
    paths:
      - backend/target/site/jacoco/
    expire_in: 7 days
  only:
    - main
    - develop
    - merge_requests

# ══════════════════════════════════════════════════════════════════════════════
# STAGE : build (Docker images)
# ══════════════════════════════════════════════════════════════════════════════

build:backend:
  stage: build
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull $IMAGE_BACKEND:latest || true
    - docker build --cache-from $IMAGE_BACKEND:latest --build-arg BUILDKIT_INLINE_CACHE=1 -t $IMAGE_BACKEND:$IMAGE_TAG -t $IMAGE_BACKEND:latest ./backend
  only:
    - main
    - develop
    - /^release\/.*/

build:frontend:
  stage: build
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull $IMAGE_FRONTEND:latest || true
    - docker build --cache-from $IMAGE_FRONTEND:latest --build-arg BUILDKIT_INLINE_CACHE=1 -t $IMAGE_FRONTEND:$IMAGE_TAG -t $IMAGE_FRONTEND:latest ./frontend
  only:
    - main
    - develop
    - /^release\/.*/

# ══════════════════════════════════════════════════════════════════════════════
# STAGE : push vers GitLab Container Registry
# ══════════════════════════════════════════════════════════════════════════════

push:images:
  stage: push
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker push $IMAGE_BACKEND:$IMAGE_TAG
    - docker push $IMAGE_BACKEND:latest
    - docker push $IMAGE_FRONTEND:$IMAGE_TAG
    - docker push $IMAGE_FRONTEND:latest
  only:
    - main
    - develop
    - /^release\/.*/

# ══════════════════════════════════════════════════════════════════════════════
# STAGE : Deploy Staging (branche develop)
# ══════════════════════════════════════════════════════════════════════════════

deploy:staging:
  stage: deploy-staging
  image: bitnami/kubectl:latest
  environment:
    name: staging
    url: http://staging.minidesk.yourdomain.com
  before_script:
    - echo "$KUBECONFIG_STAGING" > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - sed -i "s|IMAGE_TAG|$IMAGE_TAG|g" k8s/staging/*.yaml
    - kubectl apply -f k8s/staging/ --namespace=minidesk-staging
    - kubectl rollout status deployment/minidesk-backend -n minidesk-staging --timeout=120s
    - kubectl rollout status deployment/minidesk-frontend -n minidesk-staging --timeout=120s
  only:
    - develop

# ══════════════════════════════════════════════════════════════════════════════
# STAGE : Deploy Production (branche main, approbation manuelle)
# ══════════════════════════════════════════════════════════════════════════════

deploy:production:
  stage: deploy-prod
  image: bitnami/kubectl:latest
  environment:
    name: production
    url: https://minidesk.yourdomain.com
  when: manual  # ← Approbation manuelle requise dans GitLab
  allow_failure: true
  before_script:
    - echo "$KUBECONFIG_PROD" > /tmp/kubeconfig
    - export KUBECONFIG=/tmp/kubeconfig
  script:
    - sed -i "s|IMAGE_TAG|$IMAGE_TAG|g" k8s/prod/*.yaml
    - kubectl apply -f k8s/prod/ --namespace=minidesk-prod
    - kubectl rollout status deployment/minidesk-backend -n minidesk-prod --timeout=180s
    - kubectl rollout status deployment/minidesk-frontend -n minidesk-prod --timeout=180s
  only:
    - main
