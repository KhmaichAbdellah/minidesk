# ═══════════════════════════════════════════════════════════════════
# Configuration Spring Boot pour les tests CI (H2 en mémoire)
# ═══════════════════════════════════════════════════════════════════

# Base de données H2 en mémoire (remplace PostgreSQL en CI)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Désactiver open-in-view en test (évite les warnings)
spring.jpa.open-in-view=false

# JWT (clé factice pour les tests)
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1jaS1vbmx5LW5vdC11c2VkLWluLXByb2Q=
jwt.expiration=86400000

# Mail en test (mock / dummy host, pas d'envoi rÃ©el)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.username=test@minidesk.com
spring.mail.password=testpassword

# LLM en mode mock pour les tests
llm.mock=true
llm.provider=mock

# Désactiver la vérification de santé de la DB mail
management.health.mail.enabled=false

