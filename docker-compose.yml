# ═══════════════════════════════════════════════════════════════════════════════
# docker-compose.yml — MiniDesk : environnement de développement local complet
# ═══════════════════════════════════════════════════════════════════════════════
# Services :
#   - postgres     : Base de données PostgreSQL 16
#   - backend      : Spring Boot API (Java 21)
#   - frontend     : React + Vite servi par Nginx
#   - ollama       : LLM local (phi3:mini)
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: minidesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minideskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-admin}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d minideskdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minidesk-net

  # ─── Ollama (LLM local) ─────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: minidesk-ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - minidesk-net
    # Pour GPU NVIDIA, décommenter :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

  # ─── Backend Spring Boot ─────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: minidesk-backend
    restart: unless-stopped
    environment:
      # Base de données
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/minideskdb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-admin}
      # JWT
      JWT_SECRET: ${JWT_SECRET:-mySecretKeyForMiniDeskJwtAuthentication2026MySecretKey}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      # Email
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      SPRING_MAIL_PORT: ${MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD}
      # LLM / Intelligence Artificielle
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OLLAMA_ENDPOINT: http://ollama:11434/api/chat
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi3:mini}
      LLM_MOCK: ${LLM_MOCK:-false}
      # Admin par défaut
      APP_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@minidesk.com}
      APP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@2026!}
      # Spring Profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - minidesk-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── Frontend React + Nginx ──────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: minidesk-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8081}
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - minidesk-net

# ─── Volumes persistants ────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local

# ─── Réseau interne ─────────────────────────────────────────────────────────
networks:
  minidesk-net:
    driver: bridge
