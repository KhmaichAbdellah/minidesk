# ============================================================
# render.yaml — Blueprint MiniDesk pour Render.com
# ============================================================
# Services déployés :
#   - minidesk-db       : PostgreSQL 16 (base de données managée)
#   - minidesk-backend  : Spring Boot API (Java 21, port 8081)
#   - minidesk-frontend : React + Nginx (port 80)
# ============================================================

databases:
  - name: minidesk-db
    databaseName: minideskdb
    user: minidesk_user
    plan: free
    region: frankfurt

services:

  # ──────────────────────────────────────────────────────────
  # Backend Spring Boot
  # ──────────────────────────────────────────────────────────
  - type: web
    name: minidesk-backend
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      # Base de données (injectée automatiquement depuis minidesk-db)
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: minidesk-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: minidesk-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: minidesk-db
          property: password

      # JWT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"

      # Email SMTP (optionnel)
      - key: SPRING_MAIL_HOST
        value: smtp.gmail.com
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        value: ""
      - key: SPRING_MAIL_PASSWORD
        value: ""

      # Admin par défaut
      - key: APP_ADMIN_EMAIL
        value: admin@minidesk.com
      - key: APP_ADMIN_PASSWORD
        value: Admin@2026!

      # LLM — mode mock par défaut (fonctionne sans clé API)
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_MOCK
        value: "true"
      - key: OPENAI_API_KEY
        value: ""
      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # Spring & Server
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "8081"

  # ──────────────────────────────────────────────────────────
  # Frontend React + Nginx
  # ──────────────────────────────────────────────────────────
  - type: web
    name: minidesk-frontend
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # URL publique du backend (injectée dynamiquement)
      - key: VITE_API_URL
        fromService:
          type: web
          name: minidesk-backend
          property: host
