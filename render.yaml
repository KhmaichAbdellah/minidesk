# ============================================================
# render.yaml — Blueprint MiniDesk pour Render.com
# ============================================================
# Services déployés :
#   - minidesk-db       : PostgreSQL 16 (base de données)
#   - minidesk-backend  : Spring Boot API (Java 21, port 8081)
#   - minidesk-frontend : React + Nginx (port 80)
# ============================================================

databases:
  - name: minidesk-db
    databaseName: minideskdb
    user: postgres
    plan: free
    region: frankfurt

services:

  # ──────────────────────────────────────────────────────────
  # Backend Spring Boot
  # ──────────────────────────────────────────────────────────
  - type: web
    name: minidesk-backend
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      # Base de données (injectée automatiquement depuis minidesk-db)
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: minidesk-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: minidesk-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: minidesk-db
          property: password

      # JWT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"

      # Email SMTP (à remplir)
      - key: SPRING_MAIL_HOST
        value: smtp.gmail.com
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false   # à renseigner dans le dashboard Render
      - key: SPRING_MAIL_PASSWORD
        sync: false   # à renseigner dans le dashboard Render

      # Admin par défaut
      - key: APP_ADMIN_EMAIL
        value: admin@minidesk.com
      - key: APP_ADMIN_PASSWORD
        sync: false   # à renseigner dans le dashboard Render

      # LLM — mode mock par défaut (pas besoin de clé API)
      - key: LLM_PROVIDER
        value: mock
      - key: LLM_MOCK
        value: "true"
      - key: OPENAI_API_KEY
        sync: false   # à renseigner si vous voulez OpenAI
      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # Spring
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SERVER_PORT
        value: "8081"

  # ──────────────────────────────────────────────────────────
  # Frontend React + Nginx
  # ──────────────────────────────────────────────────────────
  - type: web
    name: minidesk-frontend
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      # URL publique du backend (sera l'URL Render du backend)
      - key: VITE_API_URL
        fromService:
          name: minidesk-backend
          type: web
          property: host
          envVarKey: VITE_API_URL
