# ============================================================
# render.yaml — Blueprint MiniDesk pour Render.com
# ============================================================
# Services déployés :
#   - minidesk-db       : PostgreSQL 16 (base de données managée)
#   - minidesk-backend  : Spring Boot API (Java 21, port 8081)
#   - minidesk-frontend : React + Nginx (port 80)
#
# Pour déployer : Render Dashboard → Blueprints → New Blueprint
# ============================================================

databases:
  - name: minidesk-db
    databaseName: minideskdb
    user: minidesk_user
    plan: free
    region: frankfurt

services:

  # ──────────────────────────────────────────────────────────
  # Backend Spring Boot
  # ──────────────────────────────────────────────────────────
  - type: web
    name: minidesk-backend
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      # Base de données (injectée automatiquement depuis minidesk-db)
      - key: DATABASE_URL
        fromDatabase:
          name: minidesk-db
          property: connectionString

      # JWT (clé auto-générée par Render — sécurisé)
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"

      # Email SMTP Gmail (optionnel — laisser vide si non utilisé)
      - key: SPRING_MAIL_HOST
        value: smtp.gmail.com
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        value: ""
      - key: SPRING_MAIL_PASSWORD
        value: ""

      # Compte administrateur par défaut
      - key: APP_ADMIN_EMAIL
        value: admin@minidesk.com
      - key: APP_ADMIN_PASSWORD
        value: Admin@2026!

      # LLM — mode mock par défaut (fonctionne sans clé OpenAI)
      - key: LLM_MOCK
        value: "true"
      - key: LLM_PROVIDER
        value: mock
      - key: OPENAI_API_KEY
        value: ""
      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # Spring Boot
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update

  # ──────────────────────────────────────────────────────────
  # Frontend React + Nginx
  # ──────────────────────────────────────────────────────────
  - type: web
    name: minidesk-frontend
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    healthCheckPath: /health
    envVars:
      # URL publique du backend — injectée automatiquement
      - key: VITE_API_URL
        fromService:
          type: web
          name: minidesk-backend
          property: host
